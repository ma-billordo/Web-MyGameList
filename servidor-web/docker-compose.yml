services:
  db:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: GameListDB
    volumes:
      - ./db/schema/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d GameListDB"]
      interval: 2s
      timeout: 3s
      retries: 10

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgres://postgres:postgres@db:5432/GameListDB?sslmode=disable

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgres://postgres:postgres@db:5432/GameListDB?sslmode=disable
    ports:
      - "8080:8080"
    command: sh -c "sqlc generate && go run ./cmd/server"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://localhost:8080/users"]
      interval: 3s
      timeout: 3s
      retries: 30