<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/styles.css">
    <title>MyGameList - Inicio </title>
</head>
<body>
    <main> 
        <h1 class="titulo">MyGameList 🎮 </h1>
        <h2 class="titulo"> ¡Bienvenidos! </h2>

        <p>Esta página es una proyecto de aplicación web para llevar un registro detallado, organizar y calificar todos tus videojuegos de tu biblioteca de Steam, que jugaste, estás jugando o querés jugar en el futuro, ¡incluso si los has platinado!</p>

        <div class="contenedor-formularios">
            <h3>Cargar un juego:</h3>
            <form id="form-juego">
                <label for="title">Titulo:</label>
                <input type="text" id="title" name="title" required />
                <label for="description">Descripcion:</label>
                <input type="text" id="description" name="description" required />

                <button type="submit">Subir</button>
            </form>
            
        </div>
    </main>
    
    <section class="zona-lista">
        <ul id="lista-juegos"></ul>
    </section>

    <script src="/static/js/app.js"></script>
</body>
</html>
